<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Window — Instructor Screen</title>
<style>
  :root{
    --bg:#0B1020; --bg2:#131A31; --card:#182142; --line:#2A3560;
    --ink:#EEF2FF; --dim:#95A1C8; --faint:#63709B;
    --maroon:#8C1D40; --maroon-lt:#B8285A; --gold:#FFC627;
    --low:#3DD68C; --elev:#FFC627; --serious:#FF9147; --critical:#FF5C6C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{height:100vh;display:flex;flex-direction:column;padding:2.2vh 3vw 1.6vh}

  /* Header: brand row on top, tab strip below. The strip WRAPS — with 24 slides a
     single row overflows the screen and clips the last tabs. */
  .bar{display:flex;flex-direction:column;gap:1vh;
    padding-bottom:1.1vh;border-bottom:1px solid var(--line);flex-shrink:0}
  .barrow{display:flex;justify-content:space-between;align-items:center;gap:1.5vw}
  .brand{font-size:1.5vh;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:800}
  .brand b{color:var(--gold)}
  /* The lockup is too detailed to survive the header strip, so it lives on the
     welcome slide at a size where the program line is actually readable. */
  .temlock{margin-bottom:2vh}
  .temlock img{display:block;width:34vh;max-width:100%;height:auto}

  .nav{display:flex;gap:.45vw;align-items:center;flex-wrap:wrap;row-gap:.7vh}
  .nb{background:var(--bg2);border:1px solid var(--line);color:var(--dim);
    border-radius:.8vh;padding:.7vh 1vw;font-size:1.4vh;font-weight:700;cursor:pointer;
    font-family:inherit;white-space:nowrap;flex-shrink:0}
  .nb:hover{border-color:var(--gold);color:var(--ink)}
  .nb.on{background:var(--gold);color:#20160A;border-color:var(--gold)}
  .nb.plan{border-style:dashed}
  .nb.plan.on{background:var(--maroon);color:#fff;border-color:var(--maroon);border-style:solid}
  /* Prev / next / position — for driving the deck with a mouse */
  .pager{display:flex;align-items:center;gap:.7vw;flex-shrink:0}
  .pager button{background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    border-radius:.8vh;width:4.2vh;height:4.2vh;font-size:1.9vh;cursor:pointer;
    font-family:inherit;line-height:1;display:flex;align-items:center;justify-content:center}
  .pager button:hover{border-color:var(--gold)}
  .pager button[disabled]{opacity:.28;cursor:default}
  .pos{font-size:1.5vh;color:var(--faint);font-weight:800;min-width:5.5vw;text-align:center;
    font-variant-numeric:tabular-nums}

  .body{flex:1;overflow-y:auto;padding:2.4vh 0 1vh;min-height:0}
  .body::-webkit-scrollbar{width:8px} .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  .eyebrow{font-size:1.6vh;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:1.2vh}
  h1{font-size:5.4vh;line-height:1.05;margin:0 0 2vh;letter-spacing:-.025em}
  h2{font-size:3.6vh;line-height:1.1;margin:0 0 1.6vh;letter-spacing:-.02em}
  p{font-size:2.5vh;line-height:1.5;margin:0 0 1.8vh;color:#DCE3FA;max-width:46ch}
  .wide p{max-width:none}
  .dim{color:var(--dim)}

  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:3vw;align-items:start}
  .opts{display:flex;flex-direction:column;gap:1.4vh}
  .o{display:flex;gap:1.4vw;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:1.4vh;padding:1.8vh 1.6vw}
  .ok{width:4.4vh;height:4.4vh;border-radius:1vh;background:var(--bg2);color:var(--gold);
    font-weight:800;font-size:2.2vh;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ol{font-size:2.4vh;font-weight:700;line-height:1.25}
  .os{font-size:1.8vh;color:var(--dim);margin-top:.5vh}

  /* timer */
  .timer{text-align:center}
  .tnum{font-size:16vh;font-weight:800;line-height:.9;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums}
  .tnum.warn{color:var(--serious)} .tnum.out{color:var(--critical)}
  .tctl{display:flex;gap:.8vw;justify-content:center;margin-top:2.2vh;flex-wrap:wrap}

  /* poll */
  .poll{display:flex;gap:1.4vw;align-items:flex-end;height:34vh;margin:2vh 0 1.4vh}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .colbar{width:100%;border-radius:1.2vh 1.2vh 0 0;transition:height .45s cubic-bezier(.2,.8,.2,1);
    min-height:.6vh;display:flex;align-items:flex-start;justify-content:center;padding-top:1vh}
  .colbar span{font-size:2.6vh;font-weight:800;color:#20160A}
  .colA{background:var(--critical)} .colB{background:var(--elev)} .colC{background:var(--low)}
  .collab{font-size:2vh;font-weight:800;margin-top:1.2vh;text-align:center}
  .colsub{font-size:1.5vh;color:var(--faint);text-align:center;margin-top:.4vh;max-width:22ch;line-height:1.35}
  .tally{display:flex;gap:1vw;justify-content:center;margin-top:1.6vh}
  .tb{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:1vh;
    padding:1.2vh 1.8vw;font-size:2vh;font-weight:800;cursor:pointer;font-family:inherit;min-width:9vw}
  .tb:hover{border-color:var(--gold)}
  .tb small{display:block;font-size:1.3vh;color:var(--faint);font-weight:600;margin-top:.3vh}

  /* reveal */
  .rev{border-radius:1.6vh;padding:2.4vh 2vw;border:2px solid;margin-bottom:1.8vh}
  .rev.major{border-color:var(--critical);background:rgba(255,92,108,.09)}
  .rev.minor{border-color:var(--serious);background:rgba(255,145,71,.08)}
  .rev.good{border-color:var(--low);background:rgba(61,214,140,.08)}
  .rev .t{font-size:2.9vh;font-weight:800;margin-bottom:1vh}
  .rev.major .t{color:var(--critical)} .rev.minor .t{color:var(--serious)} .rev.good .t{color:var(--low)}
  .rev .b{font-size:2.1vh;line-height:1.5;color:#DCE3FA;max-width:60ch}

  /* leaderboard */
  .lbwrap{display:grid;grid-template-columns:1fr 1fr;gap:2.4vw}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:1.5vh;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:800;padding:.9vh .6vw;border-bottom:1px solid var(--line)}
  td{padding:1vh .6vw;font-size:2.1vh;border-bottom:1px solid rgba(42,53,96,.5)}
  tr.top td{color:var(--gold);font-weight:800}
  td.sc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .entry{display:flex;gap:.6vw;margin-bottom:1.4vh;flex-wrap:wrap}
  .entry input{background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    border-radius:.9vh;padding:1.1vh .9vw;font-size:1.9vh;font-family:inherit;outline:none}
  .entry input:focus{border-color:var(--gold)}
  .entry input.nm{flex:2;min-width:9vw} .entry input.tm{flex:1.2;min-width:7vw} .entry input.sc{width:8vw}
  .entry button{background:var(--gold);color:#20160A;border:0;border-radius:.9vh;
    padding:1.1vh 1.6vw;font-size:1.9vh;font-weight:800;cursor:pointer;font-family:inherit}
  .empty{color:var(--faint);font-size:2vh;padding:2vh .6vw}

  .qr{display:flex;gap:3vw;align-items:center}
  .qrbox{background:#fff;padding:2vh;border-radius:1.6vh;flex-shrink:0}
  .qrbox canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .urlin{background:var(--bg2);border:1px solid var(--line);color:var(--gold);border-radius:.9vh;
    padding:1.2vh .9vw;font-size:2vh;font-family:ui-monospace,Menlo,Consolas,monospace;width:100%;outline:none}

  .foot{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
    padding-top:1.2vh;border-top:1px solid var(--line);font-size:1.5vh;color:var(--faint)}
  kbd{background:var(--bg2);border:1px solid var(--line);border-radius:.5vh;padding:.2vh .5vw;
    font-family:inherit;font-size:1.4vh}

  /* ---------- live sync ---------- */
  .badge{display:inline-flex;align-items:center;gap:.5vw;font-size:1.3vh;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;padding:.5vh .9vw;border-radius:3vh;
    border:1px solid var(--line);color:var(--faint)}
  .badge i{width:.9vh;height:.9vh;border-radius:50%;background:currentColor}
  .badge.live{color:var(--low);border-color:rgba(61,214,140,.4);background:rgba(61,214,140,.09)}
  .badge.lost{color:var(--serious);border-color:rgba(255,145,71,.4);background:rgba(255,145,71,.1)}

  .roomcode{font-size:11vh;font-weight:800;letter-spacing:.14em;color:var(--gold);line-height:1;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .roomlab{font-size:1.6vh;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
    font-weight:800;margin-top:1.2vh}

  .openbtn{background:var(--gold);color:#20160A;border:0;border-radius:1.1vh;
    padding:1.6vh 2.2vw;font-size:2.2vh;font-weight:800;cursor:pointer;font-family:inherit;width:100%}
  .openbtn:hover{filter:brightness(1.06)}
  .openbtn.plan{background:var(--maroon);color:#fff}
  .openbtn.done{background:var(--bg2);color:var(--low);border:1px solid rgba(61,214,140,.4);cursor:default}
  .openbtn[disabled]{background:var(--bg2);color:var(--faint);border:1px solid var(--line);cursor:not-allowed}
  .lockcount{font-size:2vh;color:var(--dim);text-align:center;margin-top:1.4vh}
  .lockcount b{color:var(--gold);font-size:2.8vh;font-variant-numeric:tabular-nums}
  .lockbar{height:.9vh;border-radius:.5vh;background:var(--bg2);margin-top:1.2vh;overflow:hidden}
  .lockbar>i{display:block;height:100%;background:var(--low);transition:width .5s}
  .srcnote{font-size:1.4vh;color:var(--faint);text-align:center;margin-top:1.2vh}
  .steps{display:flex;gap:.6vw;margin-bottom:1.6vh}
  .steps span{flex:1;text-align:center;font-size:1.4vh;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;padding:.8vh .4vw;border-radius:.8vh;background:var(--bg2);color:var(--faint)}
  .steps span.on{background:var(--maroon);color:#fff}
  .steps span.on2{background:var(--gold);color:#20160A}
</style>
</head>
<body>
<div id="stage">
  <div class="bar">
    <div class="barrow">
      <div class="brand"><b>Launch Window</b> &nbsp;·&nbsp; Instructor Screen</div>
      <div class="pager">
        <button id="prev" title="Previous slide">&#9664;</button>
        <span class="pos" id="pos"></span>
        <button id="next" title="Next slide">&#9654;</button>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot">
    <span id="hint"></span>
    <span><kbd>←</kbd> <kbd>→</kbd> slides &nbsp;·&nbsp; <kbd>space</kbd> timer &nbsp;·&nbsp; <kbd>A</kbd><kbd>B</kbd><kbd>C</kbd> tally</span>
  </div>
</div>

<script src="engine.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script>
(function(){
  'use strict';
  const G = window.LaunchWindow;

  /* engine.js holds every scenario and all the math; without it there is no deck
     to draw. A missing sync.js degrades to solo mode, but this one is fatal — so
     say which file is missing instead of throwing into a blank screen in front of
     a class. */
  if(!G || !G.ROUNDS){
    document.body.innerHTML =
      '<div style="max-width:760px;margin:12vh auto;padding:0 6vw;font:400 17px/1.6 ' +
      '-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#EEF2FF">' +
      '<div style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#FFC627;' +
      'font-weight:800;margin-bottom:14px">Launch Window</div>' +
      '<h1 style="font-size:30px;margin:0 0 16px;letter-spacing:-.02em">engine.js did not load.</h1>' +
      '<p style="color:#95A1C8">This page needs four files sitting next to it in the same folder:' +
      '<br><b style="color:#EEF2FF">engine.js</b>, <b style="color:#EEF2FF">sync.js</b>, ' +
      '<b style="color:#EEF2FF">firebase-config.js</b> and <b style="color:#EEF2FF">index.html</b>.</p>' +
      '<p style="color:#95A1C8">Two things to check, in order:</p>' +
      '<ol style="color:#95A1C8"><li>Is <b style="color:#EEF2FF">engine.js</b> actually in the same ' +
      'folder as this file? Opening host.html on its own from a Downloads folder is the usual cause.</li>' +
      '<li>Is it spelled <b style="color:#EEF2FF">engine.js</b>, all lowercase? Web hosts are ' +
      'case-sensitive even when your laptop is not.</li></ol>' +
      '<p style="color:#63709B;font-size:14px">Nothing is wrong with the game. Put the files together ' +
      'and reload.</p></div>';
    return;
  }

  // Inert stub if sync.js is missing — the deck must never fail to open in class.
  const Sync = window.LWSync || {
    enabled:false, status:'off', code:null,
    init:async()=>false, onStatus(cb){ cb('off'); }, teardown(){},
    readGates:()=>({plan:0,decide:0}),
    createRoom:async()=>null, setOpenRound(){}, setGates(){}, onPlayers(){}, onVotes(){}, endSession:async()=>{}
  };
  const body = document.getElementById('body');

  const LOCKUP = `<div class="temlock"><img src="${ASU_DARK}" alt="ASU Ira A. Fulton Schools of Engineering — Technology Entrepreneurship and Management"></div>`;

  // ---------- slide deck ----------
  // Each quarter is now TWO slides: planning, then the decision. The teacher opens
  // one gate per slide, so "allocate your weeks" and "here is the dilemma" are
  // separate moments for the room instead of one blurred one.
  const slides = [];
  slides.push({id:'welcome', label:'Start', render:renderWelcome});
  slides.push({id:'rules',   label:'Rules', render:renderRules});
  G.ROUNDS.forEach(R => {
    slides.push({id:'plan'+R.n, label:R.quarter+' plan', plan:true, render:()=>renderPlan(R)});
    slides.push({id:'q'+R.n,    label:R.quarter,          render:()=>renderRound(R)});
    slides.push({id:'poll'+R.n, label:R.quarter+' poll',  render:()=>renderPoll(R), hidden:true});
    if(R.n===4) slides.push({id:'rev4', label:'FDA',       render:()=>renderReveal('regulatory')});
    if(R.n===6) slides.push({id:'rev6', label:'Reckoning', render:()=>renderReveal('reckoning')});
  });
  slides.push({id:'lb',   label:'Leaderboard', render:renderLeaderboard});
  slides.push({id:'debr', label:'Debrief',     render:renderDebrief});

  let cur = 0;

  // ---------- state ----------
  const poll = {};   // MANUAL tallies — hands up. poll[round] = {A,B,C}
  G.ROUNDS.forEach(R => poll[R.n] = {A:0,B:0,C:0});
  const scores = []; // MANUALLY entered scores {name, team, score}

  // ---------- live state ----------
  let room = null;                 // room code, null when not live
  let players = [];                // live roster from Firebase
  const liveVotes = {};            // liveVotes[round] = {A,B,C}
  G.ROUNDS.forEach(R => liveVotes[R.n] = {A:0,B:0,C:0});
  let openPlan = 0;                // highest quarter whose planning is released
  let openDecide = 0;              // highest quarter whose decision is released

  // Displayed counts are live votes PLUS manual tallies, so a student whose phone
  // failed can still be counted with a hand raise.
  function combinedPoll(n){
    const l = liveVotes[n] || {A:0,B:0,C:0}, m = poll[n];
    return {A:l.A+m.A, B:l.B+m.B, C:l.C+m.C};
  }

  // Same idea for the leaderboard: live players merged with hand-typed entries.
  function combinedScores(){
    const live = players.filter(p => p.score > 0)
      .map(p => ({name:p.name, team:p.team || '—', score:p.score, done:!!p.done, src:'live'}));
    return live.concat(scores.map(s => Object.assign({src:'manual', done:true}, s)));
  }

  function liveBadge(){
    if(!Sync.enabled) return '';
    if(Sync.status === 'live') return `<span class="badge live"><i></i>Live · ${players.length} joined</span>`;
    return '<span class="badge lost"><i></i>Reconnecting</span>';
  }

  /* Re-render the current slide when live data changes — but ONLY when the numbers
     on screen actually changed. With 70 phones reporting in, Firebase fires a
     callback per student per write; repainting on every one of those tore the
     "Open" button out from under the teacher's click and stole focus from the
     leaderboard entry boxes mid-typing. */
  let lastSig = '';
  let liveRefresh = false;      // true while repainting from live data, not navigation
  function liveSignature(){
    return (slides[cur] && slides[cur].id) + '|' + Sync.status + '|' + players.length + '|' +
      players.map(p => p.pid+':'+p.round+':'+p.score+':'+(p.done?1:0)).sort().join(',') + '|' +
      G.ROUNDS.map(R => { const v = liveVotes[R.n] || {A:0,B:0,C:0}; return v.A+'/'+v.B+'/'+v.C; }).join(',');
  }
  function refreshIfLiveSlide(){
    const sig = liveSignature();
    if(sig === lastSig) return;
    lastSig = sig;
    const id = slides[cur] && slides[cur].id;
    if(/^(plan\d|poll\d|lb|welcome|q\d)$/.test(id)){
      liveRefresh = true;
      try{ slides[cur].render(); } finally { liveRefresh = false; }
    }
    const p = document.getElementById('livebadge');
    if(p) p.innerHTML = liveBadge();
  }

  async function startLive(){
    if(!Sync.enabled) return;
    room = await Sync.createRoom();
    if(!room) return;
    Sync.onPlayers(list => { players = list; refreshIfLiveSlide(); });
    G.ROUNDS.forEach(R => Sync.onVotes(R.n, tally => {
      liveVotes[R.n] = tally; refreshIfLiveSlide();
    }));
    Sync.onStatus(() => refreshIfLiveSlide());
    refreshIfLiveSlide();
  }

  // The two gates. Planning never goes backwards, and opening a decision implies
  // its planning is open too — so a mis-click can't lock the room out of a step.
  async function openPlanning(n){
    openPlan = Math.max(openPlan, n);
    await Sync.setGates(openPlan, openDecide);
    refreshIfLiveSlide();
  }
  async function openDecision(n){
    openDecide = Math.max(openDecide, n);
    openPlan = Math.max(openPlan, n);
    await Sync.setGates(openPlan, openDecide);
    refreshIfLiveSlide();
  }

  // ---------- timer ----------
  let tRemain = 180, tRunning = false, tId = null;
  const planTimerSet = {};      // quarters whose planning clock we've pre-set once
  function tick(){
    if(tRemain > 0) tRemain--;
    else { stopTimer(); }
    paintTimer();
  }
  function startTimer(){ if(tRunning) return; tRunning = true; tId = setInterval(tick,1000); paintTimer(); }
  function stopTimer(){ tRunning = false; clearInterval(tId); tId = null; paintTimer(); }
  function toggleTimer(){ tRunning ? stopTimer() : startTimer(); }
  function setTimer(sec){ stopTimer(); tRemain = sec; paintTimer(); }

  // ---------- minimal QR encoder (byte mode, auto version, EC level M) ----------
  function drawQR(canvas, text){
    if(!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext('2d');
    if(!ctx) return;
    try{
      const qr = buildQR(text);
      const n = qr.size;
      // Scale must be a whole number of pixels per module, and the canvas must be
      // displayed at exactly its pixel size. Letting CSS resize the canvas by a
      // fractional factor blurs the module edges and phone cameras give up on it.
      const target = Math.max(300, Math.min(520, Math.round((window.innerHeight||900) * 0.44)));
      const scale = Math.max(3, Math.floor(target / (n + 8)));
      const pad = 4 * scale;                       // 4-module quiet zone, per spec
      const px = n*scale + pad*2;
      canvas.width = canvas.height = px;
      canvas.style.width = px + 'px';
      canvas.style.height = px + 'px';
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,px,px);
      ctx.fillStyle = '#000';
      for(let y=0;y<n;y++) for(let x=0;x<n;x++)
        if(qr.modules[y][x]) ctx.fillRect(pad+x*scale, pad+y*scale, scale, scale);
    }catch(e){
      canvas.width = canvas.height = 300;
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,300,300);
      ctx.fillStyle='#8C1D40'; ctx.font='bold 17px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Type the address below', 150, 145);
      ctx.font='13px sans-serif'; ctx.fillStyle='#666';
      ctx.fillText('(address too long for a code)', 150, 170);
    }
  }

  // --- QR implementation (Reed-Solomon + matrix placement) ---
  function buildQR(text){
    const data = [];
    for(let i=0;i<text.length;i++){
      const c = text.charCodeAt(i);
      if(c<128) data.push(c);
      else if(c<2048){ data.push(192|c>>6, 128|c&63); }
      else { data.push(224|c>>12, 128|(c>>6&63), 128|c&63); }
    }
    // capacity table for EC level M, byte mode, versions 1..10
    const CAP=[0,14,26,42,62,84,106,122,152,180,213];
    let ver=0; for(let v=1;v<=10;v++) if(data.length<=CAP[v]){ver=v;break;}
    if(!ver) throw new Error('too long');

    const ECC = {1:10,2:16,3:26,4:18,5:24,6:16,7:18,8:22,9:22,10:26};
    const BLOCKS = {1:1,2:1,3:1,4:2,5:2,6:4,7:4,8:4,9:5,10:5};
    const TOTAL = {1:26,2:44,3:70,4:100,5:134,6:172,7:196,8:242,9:292,10:346};

    const size = 17 + ver*4;
    const totalCw = TOTAL[ver];
    const ecPerBlock = ECC[ver];
    const nBlocks = BLOCKS[ver];
    const dataCw = totalCw - ecPerBlock*nBlocks;

    // bit stream
    const bits = [];
    const put = (v,len)=>{ for(let i=len-1;i>=0;i--) bits.push((v>>i)&1); };
    put(4,4); put(data.length, ver<10?8:16);
    data.forEach(b=>put(b,8));
    put(0, Math.min(4, dataCw*8-bits.length));
    while(bits.length%8) bits.push(0);
    const cw=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; cw.push(b); }
    const PAD=[0xEC,0x11]; let pi=0;
    while(cw.length<dataCw) cw.push(PAD[pi++%2]);

    // GF(256)
    const EXP=new Array(512), LOG=new Array(256);
    for(let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=0x11D; }
    for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
    const mul=(a,b)=> (a&&b)? EXP[LOG[a]+LOG[b]] : 0;
    function genPoly(n){ let p=[1]; for(let i=0;i<n;i++){ const q=[1,EXP[i]], r=new Array(p.length+1).fill(0);
      for(let a=0;a<p.length;a++) for(let b=0;b<2;b++) r[a+b]^=mul(p[a],q[b]); p=r; } return p; }
    function rs(block,n){ const g=genPoly(n); const res=block.concat(new Array(n).fill(0));
      for(let i=0;i<block.length;i++){ const c=res[i]; if(!c) continue;
        for(let j=0;j<g.length;j++) res[i+j]^=mul(g[j],c); }
      return res.slice(block.length); }

    // split into blocks
    const short = Math.floor(dataCw/nBlocks), extra = dataCw%nBlocks;
    const dblocks=[], eblocks=[]; let off=0;
    for(let i=0;i<nBlocks;i++){
      const len = short + (i >= nBlocks-extra ? 1 : 0);
      const b = cw.slice(off, off+len); off+=len;
      dblocks.push(b); eblocks.push(rs(b, ecPerBlock));
    }
    const out=[];
    const maxLen = Math.max.apply(null, dblocks.map(b=>b.length));
    for(let i=0;i<maxLen;i++) dblocks.forEach(b=>{ if(i<b.length) out.push(b[i]); });
    for(let i=0;i<ecPerBlock;i++) eblocks.forEach(b=>out.push(b[i]));

    // matrix
    const m = Array.from({length:size},()=>new Array(size).fill(null));
    const setF=(x,y,v)=>{ if(x>=0&&y>=0&&x<size&&y<size) m[y][x]=v; };
    function finder(cx,cy){
      for(let dy=-1;dy<=7;dy++) for(let dx=-1;dx<=7;dx++){
        const on = (dx>=0&&dx<=6&&dy>=0&&dy<=6) &&
          (dx===0||dx===6||dy===0||dy===6 || (dx>=2&&dx<=4&&dy>=2&&dy<=4));
        setF(cx+dx, cy+dy, on?1:0);
      }
    }
    finder(0,0); finder(size-7,0); finder(0,size-7);
    for(let i=8;i<size-8;i++){ const v=(i%2===0)?1:0; m[6][i]=v; m[i][6]=v; }
    // alignment patterns
    const AL={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]}[ver];
    for(const ay of AL) for(const ax of AL){
      if((ax<8&&ay<8)||(ax<8&&ay>size-9)||(ax>size-9&&ay<8)) continue;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++)
        setF(ax+dx, ay+dy, (Math.abs(dx)===2||Math.abs(dy)===2||(dx===0&&dy===0))?1:0);
    }
    m[size-8][8]=1; // dark module

    // Version information — REQUIRED for versions 7 and up. Without it the two
    // 3x6 reserved areas get filled with data and the whole symbol is unreadable.
    if(ver >= 7){
      let vd = ver;
      for(let i=0;i<12;i++) vd = (vd<<1) ^ (((vd>>11)&1)*0x1F25);   // BCH(18,6)
      const vb = (ver<<12) | vd;
      for(let i=0;i<18;i++){
        const bit = (vb>>i)&1;
        const a = size - 11 + (i%3), b = Math.floor(i/3);
        m[a][b] = bit;   // bottom-left block
        m[b][a] = bit;   // top-right block
      }
    }
    // reserve format areas
    for(let i=0;i<9;i++){ if(m[8][i]===null)m[8][i]=0; if(m[i][8]===null)m[i][8]=0; }
    for(let i=0;i<8;i++){ if(m[8][size-1-i]===null)m[8][size-1-i]=0; if(m[size-1-i][8]===null)m[size-1-i][8]=0; }

    // place data with mask 0
    let bi=0, dir=-1, row=size-1;
    const bitAt=i=> (out[i>>3]>>(7-(i&7)))&1;
    for(let col=size-1; col>0; col-=2){
      if(col===6) col--;
      for(;;){
        for(let c=0;c<2;c++){
          const x=col-c;
          if(m[row][x]===null){
            let v = bi < out.length*8 ? bitAt(bi++) : 0;
            if(((row+x)%2)===0) v^=1;      // mask pattern 0
            m[row][x]=v;
          }
        }
        row+=dir;
        if(row<0||row>=size){ row-=dir; dir=-dir; break; }
      }
    }
    // format info: EC level M (00) + mask 0
    let fmt = (0<<3)|0, d=fmt;
    for(let i=0;i<10;i++) d = (d<<1) ^ (((d>>9)&1)*0x537);
    const bitsF = ((fmt<<10)|d) ^ 0x5412;
    // Placement is (x, y) in the spec; m is indexed [y][x].
    const fbit = i => (bitsF>>i)&1;
    for(let i=0;i<=5;i++) m[i][8]=fbit(i);
    m[7][8]=fbit(6); m[8][8]=fbit(7); m[8][7]=fbit(8);
    for(let i=9;i<15;i++) m[8][14-i]=fbit(i);
    for(let i=0;i<8;i++) m[8][size-1-i]=fbit(i);
    for(let i=8;i<15;i++) m[size-15+i][8]=fbit(i);

    return {size, modules:m};
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', e => {
    if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
    else if(e.key===' '){ e.preventDefault(); toggleTimer(); }
    else if(/^[abcABC]$/.test(e.key)){
      const s = slides[cur];
      const mm = /^poll(\d)$/.exec(s.id);
      if(mm){ poll[+mm[1]][e.key.toUpperCase()]++; s.render(); }
    }
  });

  document.getElementById('prev').onclick = () => go(cur-1);
  document.getElementById('next').onclick = () => go(cur+1);

  // ---------- boot ----------
  (async function(){
    go(0);                                  // draw immediately; never wait on the network
    if(!window.LWSync) return;
    try{
      const ok = await Promise.race([
        Sync.init(),
        new Promise(res => setTimeout(() => res(false), 8000))
      ]);
      if(ok) await startLive();
    }catch(e){ console.warn('live sync unavailable', e); }
    if(slides[cur].id === 'welcome') renderWelcome();   // repaint with the room code
  })();
})();
</script>
</body>
</html>
