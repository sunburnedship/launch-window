<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Launch Window — Pulse</title>
<style>
  :root{
    --bg:#0B1020; --bg2:#131A31; --card:#182142; --line:#2A3560;
    --ink:#EEF2FF; --dim:#95A1C8; --faint:#63709B;
    --maroon:#8C1D40; --maroon-lt:#B8285A; --gold:#FFC627;
    --build:#FFC627; --validate:#4CC9F0; --protect:#7BDFA0; --audit:#C77DFF;
    --low:#3DD68C; --elev:#FFC627; --serious:#FF9147; --critical:#FF5C6C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{padding-bottom:env(safe-area-inset-bottom)}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  .pad{padding:18px 18px 26px}
  h1{font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
  h2{font-size:20px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
  p{line-height:1.55;margin:0 0 14px;color:var(--ink)}
  .muted{color:var(--dim)}
  .tiny{font-size:12.5px;line-height:1.5;color:var(--faint)}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
    font-weight:700;margin-bottom:8px}

  /* ---------- ASU / TEM lockup ---------- */
  /* Placeholder: the official Fulton Schools lockup, keyed off its white
     background. Reversed treatment (white type, gold sparky) for the navy UI;
     the original colours on the white certificate. */
  .temlock{margin:0 0 16px}
  .temlock img{display:block;width:100%;max-width:290px;height:auto}
  .temfoot{display:flex;justify-content:center;margin-top:28px}
  .temfoot img{width:200px;height:auto;opacity:.8}

  /* ---------- buttons ---------- */
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:17px 18px;
    font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;
    background:var(--gold);color:#20160A;margin-top:12px;transition:transform .06s,opacity .15s}
  .btn:active{transform:scale(.985)}
  .btn[disabled]{opacity:.32;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--dim);border:1.5px solid var(--line);font-size:15px;padding:13px}
  /* ASU maroon call-to-action. Used as an <a>, so it needs the text reset that
     a <button> gets for free. */
  .btn.asu{background:var(--maroon);color:#fff;text-decoration:none;text-align:center}
  .btn.asu:visited{color:#fff}

  input{width:100%;padding:15px 16px;border-radius:13px;border:1.5px solid var(--line);
    background:var(--bg2);color:var(--ink);font-size:16px;font-family:inherit;margin-bottom:12px;outline:none}
  input:focus{border-color:var(--gold)}
  input::placeholder{color:var(--faint)}
  label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 6px 3px;font-weight:600}

  /* ---------- dashboard ---------- */
  .dash{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.94);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px 11px}
  .dash-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .qtag{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .val{font-size:19px;font-weight:800;color:var(--gold);letter-spacing:-.02em}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
  .stat{background:var(--bg2);border-radius:10px;padding:7px 9px}
  .stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .stat .v{font-size:16px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
  .risks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .risk{border-radius:10px;padding:6px 9px;border:1.5px solid}
  .risk .k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.75}
  .risk .v{font-size:13px;font-weight:800;margin-top:1px}
  .band-low{color:var(--low);border-color:rgba(61,214,140,.35);background:rgba(61,214,140,.09)}
  .band-elev{color:var(--elev);border-color:rgba(255,198,39,.35);background:rgba(255,198,39,.09)}
  .band-serious{color:var(--serious);border-color:rgba(255,145,71,.4);background:rgba(255,145,71,.1)}
  .band-critical{color:var(--critical);border-color:rgba(255,92,108,.45);background:rgba(255,92,108,.12)}

  /* ---------- allocation ---------- */
  .weeks{text-align:center;background:var(--bg2);border:1.5px solid var(--line);
    border-radius:14px;padding:13px;margin-bottom:14px}
  .weeks .n{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .weeks.done .n{color:var(--low)}
  .weeks .l{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-top:5px}

  .track{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;
    border-left:4px solid var(--tc)}
  .track-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .track-name{font-size:15px;font-weight:800;color:var(--tc);letter-spacing:.02em}
  .track-tag{font-size:11px;color:var(--faint);margin-top:1px}
  .stepper{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .step{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);
    background:var(--bg2);color:var(--ink);font-size:21px;font-weight:700;line-height:1;
    cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
  .step:active{background:var(--line)}
  .step[disabled]{opacity:.25}
  .step-n{min-width:24px;text-align:center;font-size:20px;font-weight:800}
  .track-desc{font-size:12.5px;color:var(--dim);line-height:1.45;margin-top:8px}
  .bar{height:5px;border-radius:3px;background:var(--bg2);margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--tc);border-radius:3px;transition:width .2s}

  /* ---------- dilemma ---------- */
  .scenario{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;
    border:1px solid var(--line)}
  .scenario p{font-size:15px;margin:0;color:#DCE3FA}
  .warn{background:rgba(255,145,71,.1);border:1.5px solid rgba(255,145,71,.4);
    border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:13.5px;
    color:#FFC49B;line-height:1.45}
  .q{font-size:17px;font-weight:800;margin:0 0 12px}
  .opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;padding:15px;margin-bottom:11px;cursor:pointer;font-family:inherit;
    color:var(--ink);display:flex;gap:12px;align-items:flex-start}
  .opt:active{border-color:var(--gold)}
  .opt-k{width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--gold);
    font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .opt-l{font-size:15.5px;font-weight:700;line-height:1.3}
  .opt-s{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.4}

  /* ---------- resolve / events ---------- */
  .deltas{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
  .d{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--bg2);color:var(--dim)}
  .d.up{color:var(--low);background:rgba(61,214,140,.11)}
  .d.down{color:var(--critical);background:rgba(255,92,108,.11)}

  .event{border-radius:16px;padding:18px;margin-bottom:14px;border:2px solid}
  .event.major{border-color:var(--critical);background:rgba(255,92,108,.09)}
  .event.minor{border-color:var(--serious);background:rgba(255,145,71,.08)}
  .event.good{border-color:var(--low);background:rgba(61,214,140,.08)}
  .event .ico{font-size:26px;line-height:1;margin-bottom:9px}
  .event .t{font-size:16.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:9px}
  .event.major .t{color:var(--critical)} .event.minor .t{color:var(--serious)} .event.good .t{color:var(--low)}
  .event .b{font-size:14px;line-height:1.55;color:#DCE3FA}
  .event .les{font-size:13px;line-height:1.5;font-style:italic;color:var(--dim);
    margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}

  /* ---------- final ---------- */
  .bigscore{text-align:center;padding:22px 0 6px}
  .bigscore .n{font-size:60px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-.035em}
  .bigscore .l{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-top:7px}
  .arch{text-align:center;background:var(--card);border:1.5px solid var(--gold);border-radius:16px;
    padding:18px;margin:16px 0}
  .arch .t{font-size:23px;font-weight:800;color:var(--gold);letter-spacing:-.02em;margin-bottom:9px}
  .arch .b{font-size:14px;line-height:1.55;color:#DCE3FA}
  .brk{background:var(--card);border-radius:14px;padding:6px 15px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border:0}
  .row b{font-weight:800}
  .row.tot{font-size:16.5px;font-weight:800;color:var(--gold)}

  .code{background:var(--bg2);border:2px dashed var(--gold);border-radius:14px;padding:15px;
    text-align:center;margin-bottom:14px}
  .code .c{font-size:27px;font-weight:800;letter-spacing:.12em;color:var(--gold);font-family:ui-monospace,Menlo,Consolas,monospace}
  .code .l{font-size:11.5px;color:var(--faint);margin-top:6px;letter-spacing:.05em}

  /* ---------- certificate ---------- */
  .cert{background:#fff;color:#1A1A1A;border-radius:14px;padding:34px 26px;text-align:center;
    border:10px solid var(--maroon);margin-bottom:14px}
  .cert .cmark img{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 18px}
  .cert .cn{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--maroon);font-weight:800}
  .cert .ct{font-size:26px;font-weight:800;margin:14px 0 4px;letter-spacing:-.02em}
  .cert .cs{font-size:12.5px;color:#555;margin-bottom:22px}
  .cert .cw{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#888;font-weight:700}
  .cert .cname{font-size:30px;font-weight:800;margin:9px 0 18px;border-bottom:2.5px solid var(--maroon);
    display:inline-block;padding:0 20px 8px;letter-spacing:-.02em;line-height:1.2}
  .cert .carch{font-size:19px;font-weight:800;color:var(--maroon);margin-bottom:5px}
  .cert .cscore{font-size:14px;color:#444;margin-bottom:22px}
  .cert .cfoot{font-size:10.5px;color:#777;line-height:1.6;border-top:1px solid #DDD;padding-top:15px}

  .prog{display:flex;gap:5px;margin-bottom:15px}
  .prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .prog i.on{background:var(--gold)}

  @media print{
    body,html{background:#fff}
    .dash,.btn,.tiny,.noprint{display:none!important}
    #app{max-width:100%}
    .cert{border-radius:0;page-break-inside:avoid}
  }
  @keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .fade{animation:fade .25s ease-out}

  /* ---------- live sync ---------- */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:20px;
    border:1px solid var(--line);color:var(--faint)}
  .badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .badge.live{color:var(--low);border-color:rgba(61,214,140,.4);background:rgba(61,214,140,.09)}
  .badge.lost{color:var(--serious);border-color:rgba(255,145,71,.4);background:rgba(255,145,71,.09)}
  .badge.solo{color:var(--faint)}
  .dash-top .badge{margin-left:8px}

  .roomin{text-transform:uppercase;letter-spacing:.22em;font-weight:800;font-size:22px;text-align:center}
  .wait{text-align:center;padding:44px 0 10px}
  .wait .spin{width:44px;height:44px;border-radius:50%;margin:0 auto 20px;
    border:3px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wait .big{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  .wait .sub{font-size:14.5px;color:var(--dim);line-height:1.5;max-width:30ch;margin:0 auto}
  .roster{background:var(--card);border-radius:13px;padding:13px 15px;margin-top:20px;
    font-size:13.5px;color:var(--dim);text-align:center}
  .roster b{color:var(--gold);font-size:17px}
  .plan{background:var(--card);border-radius:13px;padding:13px 15px;margin-top:18px;
    font-size:13px;color:var(--dim);line-height:1.5;text-align:left}
  .plan b{color:var(--ink)}
  .ok{background:rgba(61,214,140,.1);border:1.5px solid rgba(61,214,140,.4);border-radius:13px;
    padding:13px 15px;font-size:14px;color:var(--low);font-weight:700;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>

<script src="engine.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script>
(function(){
  'use strict';
  const G = window.LaunchWindow;

  /* engine.js holds every scenario and all the math. A missing sync.js degrades
     to solo mode; this one is fatal, so name the missing file rather than hand a
     student a blank screen. */
  if(!G || !G.ROUNDS){
    document.body.innerHTML =
      '<div style="max-width:520px;margin:0 auto;padding:60px 22px;font:400 16px/1.6 ' +
      '-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#EEF2FF">' +
      '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#FFC627;' +
      'font-weight:700;margin-bottom:10px">Launch Window</div>' +
      '<h1 style="font-size:24px;margin:0 0 14px;letter-spacing:-.02em">This page is missing a file.</h1>' +
      '<p style="color:#95A1C8">The game needs <b style="color:#EEF2FF">engine.js</b> in the same ' +
      'folder as this page, and it is not there.</p>' +
      '<p style="color:#95A1C8">If you are a student: tell your instructor the game says ' +
      '<b style="color:#EEF2FF">engine.js is missing</b>. Nothing is wrong with your phone.</p>' +
      '<p style="color:#63709B;font-size:13.5px">Instructor: upload engine.js, sync.js and ' +
      'firebase-config.js alongside index.html and host.html. Check the capitalization too &mdash; ' +
      'web hosts are case-sensitive.</p></div>';
    return;
  }

  // If sync.js is missing or failed to load — forgotten upload, blocked CDN, bad
  // path — fall back to an inert stub so the game still runs solo instead of
  // white-screening. Every method is a safe no-op.
  const Sync = window.LWSync || {
    enabled:false, status:'off', code:null, pid:null,
    init:async()=>false, onStatus(cb){ cb('off'); }, teardown(){},
    readGates:()=>({plan:99, decide:99}),
    joinRoom:async()=>null, rejoinRoom:async()=>null, roomExists:async()=>false, onRoom(){},
    submitVote(){}, reportProgress(){},
    createRoom:async()=>null, setOpenRound(){}, setGates(){}, onPlayers(){}, onVotes(){}, endSession:async()=>{}
  };
  const app = document.getElementById('app');
  const SAVE = 'launchwindow.v2';

  // Where "Explore the TEM program" sends a student. Outbound link only — nothing
  // about the student is collected, sent, or stored. Opens in a new tab so the

  const LOCKUP = `<div class="temlock"><img src="${ASU_DARK}" alt="ASU Ira A. Fulton Schools of Engineering — Technology Entrepreneurship and Management"></div>`;
  const FOOTMARK = `<div class="temfoot noprint"><img src="${ASU_DARK}" alt=""></div>`;

  let S = null;                 // game state
  let alloc = null;             // current round allocation
  let lastDeltas = null;        // for the resolve screen
  let pendingEvents = [];

  // ---- live sync state ----
  let live = false;             // are we in a synced room?
  let planOpen = 99;            // highest round whose PLANNING is open (99 = solo)
  let decideOpen = 99;          // highest round whose DECISION is open (99 = solo)
  let waitingPlan = 0;          // round we are parked waiting to plan, 0 = not waiting
  let waitingDecide = 0;        // round we are parked waiting to decide
  let savedRoom = null;         // room code, kept across reloads
  let savedPid = null;          // our player id, kept across reloads

  // ---------- persistence (best effort; private browsing may block) ----------
  // The room code and player id ride along with the game state. Without them a
  // reload could never get back into the room, which is what stranded students
  // off the leaderboard.
  function save(screen){
    try{
      localStorage.setItem(SAVE, JSON.stringify({
        S:S, screen:screen,
        room: (S && S.room) || savedRoom || null,
        pid: Sync.pid || savedPid || null
      }));
    }catch(e){}
  }
  function load(){
    try{ return JSON.parse(localStorage.getItem(SAVE)); }catch(e){ return null; }
  }
  function wipe(){ try{ localStorage.removeItem(SAVE); }catch(e){} }

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtUsers = u => u >= 1000 ? (u/1000).toFixed(1)+'M' : Math.round(u)+'k';
  const fmtCash  = c => (c < 0 ? '-$' : '$') + Math.abs(c).toFixed(1) + 'M';

  function show(html, keepScroll){
    app.innerHTML = html;
    if(!keepScroll) window.scrollTo(0,0);
  }

  function dash(){
    if(!S) return '';
    const rows = [
      ['Safety',   S.rSafety],
      ['Data',     S.rData],
      ['Fairness', S.rBias]
    ].map(([k,v]) => {
      const b = G.band(v);
      return `<div class="risk ${b.cls}"><div class="k">${k}</div><div class="v">${b.label}</div></div>`;
    }).join('');
    const sc = G.score(S, S.round);
    return `<div class="dash">
      <div class="dash-top">
        <span class="qtag">Quarter ${S.round} of 6 &nbsp;·&nbsp; Pulse${badge()}</span>
        <span class="val">${sc.total.toLocaleString()}</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Users</div><div class="v">${fmtUsers(S.users)}</div></div>
        <div class="stat"><div class="k">Cash</div><div class="v">${fmtCash(S.cash)}</div></div>
        <div class="stat"><div class="k">Trust</div><div class="v">${Math.round(S.trust)}</div></div>
      </div>
      <div class="risks">${rows}</div>
    </div>`;
  }

  // Honest connection badge. Never claims live when it isn't.
  function badge(){
    if(!live) return '';
    if(Sync.status === 'live') return ' <span class="badge live"><i></i>Live</span>';
    return ' <span class="badge lost"><i></i>Reconnecting</span>';
  }

  function progress(){
    let h = '<div class="prog">';
    for(let i=1;i<=6;i++) h += `<i class="${i<=S.round?'on':''}"></i>`;
    return h + '</div>';
  }

  function snapshot(){
    return {users:S.users, cash:S.cash, trust:S.trust, rSafety:S.rSafety, rData:S.rData, rBias:S.rBias};
  }
  function diff(before){
    const d = [];
    const push = (label, now, then, invert, fmt) => {
      const delta = now - then;
      if(Math.abs(delta) < 0.5) return;
      const good = invert ? delta < 0 : delta > 0;
      const sign = delta > 0 ? '+' : '−';
      d.push(`<span class="d ${good?'up':'down'}">${label} ${sign}${fmt?fmt(Math.abs(delta)):Math.round(Math.abs(delta))}</span>`);
    };
    push('Users', S.users, before.users, false);
    push('Cash', S.cash, before.cash, false, v => '$'+v.toFixed(1)+'M');
    push('Trust', S.trust, before.trust, false);
    push('Safety risk', S.rSafety, before.rSafety, true);
    push('Data risk', S.rData, before.rData, true);
    push('Fairness risk', S.rBias, before.rBias, true);
    return d.length ? `<div class="deltas">${d.join('')}</div>` : '';
  }

  // =================================================================
  // ROOM WIRING
  // =================================================================

  // One place that reacts to the instructor's two gates. Called on every meta
  // change, and once right after joining or rejoining.
  function applyMeta(meta){
    const g = Sync.readGates(meta);
    planOpen = g.plan; decideOpen = g.decide;
    if(waitingPlan && planOpen >= waitingPlan){ waitingPlan = 0; screenAllocate(); return; }
    if(waitingDecide && decideOpen >= waitingDecide){ waitingDecide = 0; screenDilemma(); return; }
    if(waitingPlan || waitingDecide) renderWait();
  }

  function attachRoom(){
    live = true;
    Sync.onRoom(applyMeta);
    Sync.onStatus(() => { if(document.querySelector('.dash')) refreshBadge(); });
  }

  // =================================================================
  // SCREENS
  // =================================================================

  function screenStart(){
    // The QR code on the instructor screen carries ?room=CODE, so most students
    // never type it. The field stays editable for anyone who typed the URL by hand.
    let prefill = '';
    try{
      const m = /[?&]room=([A-Za-z2-9]{4})/.exec(location.search || '');
      if(m) prefill = m[1].toUpperCase();
    }catch(e){}

    show(`<div class="pad fade" style="padding-top:44px">
      ${LOCKUP}
      <h1>Launch Window</h1>
      <p class="muted" style="font-size:15px">You are the founder and CTO of <b style="color:var(--gold)">Pulse</b>,
      a wrist-worn health monitor with an AI that reads your heart rhythm and tells you what to do about it.</p>
      <p class="muted" style="font-size:15px">You have six quarters to build the most valuable company in this room.
      Every quarter you decide where your engineers spend their time, and you make one call nobody else can make for you.</p>
      <div style="height:14px"></div>
      <label>Your name</label>
      <input id="nm" placeholder="First name and last initial" autocomplete="off" maxlength="28">
      <label>Your team</label>
      <input id="tm" placeholder="Team name or number" autocomplete="off" maxlength="20">
      ${Sync.enabled ? `
        <label>Room code${prefill ? '' : ' <span style="color:var(--faint);font-weight:400">— on the big screen</span>'}</label>
        <input id="rm" class="roomin" placeholder="XXXX" autocomplete="off" maxlength="4" value="${esc(prefill)}">
      ` : ''}
      <div id="err" class="tiny" style="color:var(--critical);margin:-4px 0 8px 3px"></div>
      <button class="btn" id="go">${Sync.enabled ? 'Join the session' : 'Start Q1'}</button>
      <p class="tiny" style="margin-top:16px">Your score is your company's valuation at the end of Q6.
      Individual and team leaderboards are both scored.</p>
      ${FOOTMARK}
    </div>`);

    const err = document.getElementById('err');
    document.getElementById('go').onclick = async () => {
      const nm = document.getElementById('nm').value.trim();
      const tm = document.getElementById('tm').value.trim();
      if(!nm){ document.getElementById('nm').focus(); return; }

      S = G.newState(nm, tm || '—');

      if(Sync.enabled){
        const rmEl = document.getElementById('rm');
        const code = (rmEl.value || '').trim().toUpperCase();
        if(code.length !== 4){ err.textContent = 'Enter the 4-letter room code from the screen.'; rmEl.focus(); return; }
        const btn = document.getElementById('go');
        btn.disabled = true; btn.textContent = 'Joining…';

          return;
        }
        S.room = code; savedRoom = code; savedPid = pid;
        attachRoom();
        screenBrief();
        return;
      }

      screenBrief();
    };
  }

  // Repaint just the badge without re-rendering the screen underneath
  function refreshBadge(){
    const q = document.querySelector('.dash-top .qtag');
    if(q && S) q.innerHTML = `Quarter ${S.round} of 6 &nbsp;·&nbsp; Pulse${badge()}`;
  }

  function screenBrief(){
    show(`<div class="pad fade" style="padding-top:30px">
      ${LOCKUP}
      <div class="eyebrow">Briefing</div>
      <h2>How Pulse is scored</h2>

  /* The instructor now opens each quarter in two steps from the host screen:
     "Open Q3 planning" lets the room allocate its weeks, then "Open Q3 decision"
     reveals the dilemma. Students may move whenever they are ready inside an open
     step, but cannot run ahead of the room. A student who joins late simply catches
     up — nobody is ever blocked by anybody else. */
  function gateOrAllocate(){
    if(live && planOpen < S.round){ waitingPlan = S.round; waitingDecide = 0; renderWait(); return; }
    waitingPlan = 0;
    screenAllocate();
  }

  function gateOrDilemma(){
    if(live && decideOpen < S.round){ waitingDecide = S.round; waitingPlan = 0; renderWait(); return; }
    waitingDecide = 0;
    screenDilemma();
  }

  function allocSummary(){
    if(!alloc) return '';
    return G.TRACKS.map(t => `<b style="color:${t.color}">${t.name} ${alloc[t.key]}</b>`).join(' &nbsp;·&nbsp; ');
  }

  function renderWait(){
    const forDecision = !!waitingDecide;
    save(forDecision ? 'waitd' : 'wait');
    const first = S.round === 1 && !forDecision;
    const title = forDecision
      ? 'Plan locked for Q' + S.round + '.'
      : (first ? 'You’re in.' : 'Quarter ' + (S.round - 1) + ' locked in.');
    const sub = forDecision
      ? 'Your engineers are at work. Your instructor will reveal this quarter’s decision in a moment.'
      : (first
        ? 'Waiting for your instructor to open Q1 planning. Keep this screen open.'
        : 'Waiting for the rest of the room. Your instructor will open Q' + S.round + ' planning shortly.');

    show(`<div class="pad fade">
      <div class="wait">
        <div class="spin"></div>
        <div class="big">${title}</div>
        <div class="sub">${sub}</div>
        ${first ? `<div class="roster">Room <b>${esc(S.room || savedRoom || '')}</b></div>` : ''}
        ${forDecision ? `<div class="plan">This quarter you funded<br>${allocSummary()}</div>` : ''}
      </div>
      <p class="tiny" style="text-align:center;margin-top:22px">
        ${Sync.status === 'live'
          ? 'Nothing to do right now.'
          : 'Connection dropped. You can keep playing — tap below to continue on your own.'}
      </p>
      ${Sync.status !== 'live' ? '<button class="btn ghost" id="solo">Continue without the room</button>' : ''}
      ${FOOTMARK}
    </div>`);
    const s = document.getElementById('solo');
    if(s) s.onclick = () => {
      live = false; planOpen = 99; decideOpen = 99;
      const wasDecide = !!waitingDecide;
      waitingPlan = 0; waitingDecide = 0;
      wasDecide ? screenDilemma() : screenAllocate();
    };
  }

  function screenAllocate(){
    alloc = {build:0, validate:0, protect:0, audit:0};
    save('allocate');
    renderAllocate();
  }

  function renderAllocate(){
    const W = G.CONFIG.WEEKS_PER_ROUND;
    const used = alloc.build + alloc.validate + alloc.protect + alloc.audit;
    const left = W - used;
    const R = G.ROUNDS[S.round - 1];

    const tracks = G.TRACKS.map(t => `
      <div class="track" style="--tc:${t.color}">
        <div class="track-head">
          <div>
            <div class="track-name">${t.name}</div>
            <div class="track-tag">${t.tag}</div>
          </div>
          <div class="stepper">
            <button class="step" data-m="${t.key}" ${alloc[t.key]===0?'disabled':''}>−</button>
            <span class="step-n">${alloc[t.key]}</span>
            <button class="step" data-p="${t.key}" ${left===0?'disabled':''}>+</button>
          </div>
        </div>
        <div class="track-desc">${t.desc}</div>
        <div class="bar"><i style="width:${alloc[t.key]/W*100}%"></i></div>
      </div>`).join('');

    show(dash() + `<div class="pad">
      ${progress()}
      <div class="eyebrow">${R.quarter} · Step 1 of 2 · Engineering plan</div>
      <h2>Where do your 10 weeks go?</h2>
      <div class="weeks ${left===0?'done':''}">
        <div class="n">${left}</div>
        <div class="l">${left===0?'All weeks assigned':'weeks left to assign'}</div>
      </div>
      ${tracks}
      <button class="btn" id="go" ${left!==0?'disabled':''}>
        ${left===0?'Lock the plan':'Assign all 10 weeks'}
      </button>
    </div>`, true);

    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      if(left > 0){ alloc[b.dataset.p]++; renderAllocate(); }
    });
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      if(alloc[b.dataset.m] > 0){ alloc[b.dataset.m]--; renderAllocate(); }
    });
    const go = document.getElementById('go');
    if(go) go.onclick = () => {
      G.applyAllocation(S, alloc);
      // Tell the host this student has locked their plan, so the planning slide
      // can show "31 of 42 have locked their plan" and the teacher knows when to
      // reveal the decision.
      if(live) Sync.reportProgress(S.round, G.score(S, S.round).total, false);
      gateOrDilemma();
    };
  }

  function screenDilemma(){
    const R = G.ROUNDS[S.round - 1];
    save('dilemma');
    const opts = R.options.map(o => `
      <button class="opt" data-k="${o.key}">
        <span class="opt-k">${o.key}</span>
        <span><span class="opt-l">${esc(o.label)}</span><span class="opt-s">${esc(o.sub)}</span></span>
      </button>`).join('');

    show(dash() + `<div class="pad fade">
      <div class="eyebrow">${R.quarter} · Step 2 of 2 · Decision</div>
      <h2>${esc(R.title)}</h2>
      ${R.warning ? `<div class="warn"><b>Heads up.</b> ${esc(R.warning)}</div>` : ''}
      <div class="scenario"><p>${esc(R.brief)}</p></div>
      <div class="q">${esc(R.question)}</div>
      ${opts}
      <p class="tiny">There is no obviously right answer. That is the point.</p>
    </div>`);

    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const o = R.options.find(x => x.key === b.dataset.k);
      const before = snapshot();
      G.applyChoice(S, o.fx);
      S.choices.push({round:S.round, key:o.key});
      // Feeds the live histogram on the instructor screen. Fire and forget —
      // a failed write must never interrupt the student's game.
      if(live) Sync.submitVote(S.round, o.key);
      lastDeltas = diff(before);
      pendingEvents = [];
      if(S.round === 4) pendingEvents = pendingEvents.concat(G.checkpoint(S, 'regulatory'));
      if(S.round === 6) pendingEvents = pendingEvents.concat(G.checkpoint(S, 'reckoning'));
      const rescue = G.checkSolvency(S);
      if(rescue) pendingEvents.push(rescue);
      /* Remember that this quarter's choice has already been applied. Without
         this, a phone that reloaded on the outcome screen came back to the
         dilemma and let the student choose again — applying a second set of
         effects, re-running the Q4/Q6 checkpoints, and overwriting their vote. */
      S.pending = {key:o.key, events:pendingEvents, deltas:lastDeltas};
      screenResolve(o);
    });
  }

  function screenResolve(o){
    const R = G.ROUNDS[S.round - 1];
    save('resolve');
    show(dash() + `<div class="pad fade">
      <div class="eyebrow">${R.quarter} · Outcome</div>
      <h2>You chose ${o.key}</h2>
      <p style="font-weight:700;color:var(--gold);font-size:14.5px">${esc(o.label)}</p>
      <div class="scenario"><p>${esc(o.result)}</p></div>
      ${lastDeltas}
      <button class="btn" id="go">${pendingEvents.length ? 'Continue' : (S.round < 6 ? 'Next quarter' : 'Final results')}</button>
    </div>`);
    document.getElementById('go').onclick = () => {
      if(pendingEvents.length) screenEvents();
      else nextRound();
    };
  }

  function screenEvents(){
    save('events');
    const html = pendingEvents.map(e => `
      <div class="event ${e.severity}">
        <div class="ico">${e.icon}</div>
        <div class="t">${esc(e.title)}</div>
        <div class="b">${esc(e.body)}</div>
        <div class="les">${esc(e.lesson)}</div>
      </div>`).join('');
    const label = S.round === 4 ? 'Q4 · Regulatory review' : (S.round === 6 ? 'Q6 · The reckoning' : 'Company news');
    show(dash() + `<div class="pad fade">
      <div class="eyebrow">${label}</div>
      <h2>${S.round === 4 ? 'The bill arrives' : 'Everything becomes public'}</h2>
      ${html}
      <button class="btn" id="go">${S.round < 6 ? 'Continue to Q'+(S.round+1) : 'See final results'}</button>
    </div>`);
    document.getElementById('go').onclick = nextRound;
  }

  function nextRound(){
    S.pending = null;              // this quarter is fully resolved
    S.history.push(snapshot());
    if(live) Sync.reportProgress(S.round, G.score(S, S.round).total, S.round >= 6);
    if(S.round >= 6){ screenFinal(); return; }
    S.round++;
    gateOrAllocate();
  }

  function resultCode(sc){
    const initials = (S.name.match(/\b\w/g) || ['X']).join('').slice(0,3).toUpperCase();
    return initials + '-' + String(sc.total).padStart(4,'0');
  }

      : 'none';

    const onBoard = live && Sync.status === 'live';

    show(`<div class="pad fade" style="padding-top:34px">
      <div class="eyebrow">Q6 · Final valuation</div>
      <div class="bigscore">

        <div class="l">Venture value</div>
      </div>

      <div class="arch">
        <div class="t">${esc(a.title)}</div>
        <div class="b">${esc(a.blurb)}</div>
      </div>

      <div class="code">
        <div class="c">${resultCode(sc)}</div>
        <div class="l">${onBoard
          ? 'Already on the leaderboard — this is your backup code'
          : 'Read this to your instructor'}</div>
      </div>

      ${onBoard ? '' : `<div id="sendwrap">
        <button class="btn ghost" id="send">Send my score to the class leaderboard</button>
      </div>`}

      <div class="brk">
        <div class="row"><span>Users &amp; cash you built</span><b>${p.built.toLocaleString()}</b></div>
        <div class="row"><span>Public trust multiplier</span><b>${p.trustMult.toFixed(2)}×</b></div>
        <div class="row"><span>Value after trust</span><b>${p.multiplied.toLocaleString()}</b></div>
        <div class="row"><span>Unresolved risk penalty</span><b style="color:var(--critical)">${p.risk.toLocaleString()}</b></div>
        <div class="row"><span>Integrity bonus <span class="tiny">(${esc(integ)})</span></span><b style="color:var(--low)">+${p.integrity.toLocaleString()}</b></div>
        <div class="row tot"><span>Venture value</span><b>${sc.total.toLocaleString()}</b></div>
      </div>

      <div class="brk">
        <div class="row"><span>Final users</span><b>${fmtUsers(S.users)}</b></div>
        <div class="row"><span>Cash on hand</span><b>${fmtCash(S.cash)}</b></div>
        <div class="row"><span>Public trust</span><b>${Math.round(S.trust)} / 100</b></div>
        <div class="row"><span>Safety risk</span><b style="color:var(--${G.band(S.rSafety).cls.replace('band-','')})">${G.band(S.rSafety).label}</b></div>
        <div class="row"><span>Data risk</span><b style="color:var(--${G.band(S.rData).cls.replace('band-','')})">${G.band(S.rData).label}</b></div>
        <div class="row"><span>Fairness risk</span><b style="color:var(--${G.band(S.rBias).cls.replace('band-','')})">${G.band(S.rBias).label}</b></div>
      </div>

      <button class="btn" id="cert">Get my certificate</button>
      ${temButton()}
      <button class="btn ghost" id="again">Play again</button>
      <p class="tiny" style="margin-top:16px">Curious how the other decisions would have played out?
      That question is roughly the entire TEM curriculum.</p>
      ${FOOTMARK}
    </div>`);

    document.getElementById('cert').onclick = () => screenCert(sc, a);
    document.getElementById('again').onclick = () => { wipe(); screenStart(); };
    const sb = document.getElementById('send');
    if(sb) sb.onclick = () => renderSend(sc);
  }

  // Late score submission. Asks for the room code, rejoins under the student's
  // original player id when we still have it, and writes the final score.
  function renderSend(sc){
    const wrap = document.getElementById('sendwrap');
    if(!wrap) return;
    wrap.innerHTML = `
      <label>Room code from the big screen</label>
      <input id="rm2" class="roomin" placeholder="XXXX" autocomplete="off" maxlength="4"
        value="${esc(savedRoom || (S && S.room) || '')}">
      <div id="err2" class="tiny" style="color:var(--critical);margin:-4px 0 8px 3px"></div>
      <button class="btn ghost" id="send2">Send my score</button>`;
    const err = document.getElementById('err2');
    document.getElementById('send2').onclick = async () => {
      const btn = document.getElementById('send2');
      const code = (document.getElementById('rm2').value || '').trim().toUpperCase();
      if(code.length !== 4){ err.textContent = 'Enter the 4-letter code.'; return; }
      btn.disabled = true; btn.textContent = 'Sending…';
      try{
        if(!Sync.enabled) await Sync.init();
        const pid = await Sync.rejoinRoom(code, savedPid, {
          name: S.name, team: S.team, score: sc.total, round: 6, done: true
        }) || await Sync.joinRoom(code, S.name, S.team);
        if(!pid){
          err.textContent = 'No session found with code ' + code + '.';
          btn.disabled = false; btn.textContent = 'Send my score';
          return;
        }
        savedRoom = code; savedPid = pid; S.room = code;
        attachRoom();
        await Sync.reportProgress(6, sc.total, true);
        save('final');
        wrap.innerHTML = `<div class="ok">✓ Sent. Your score is on the class leaderboard.</div>`;
      }catch(e){
        err.textContent = 'Could not reach the room. Read your code to your instructor instead.';
        btn.disabled = false; btn.textContent = 'Send my score';
      }
    };
  }

  // ---------- boot ----------
  async function boot(){
    // Try to bring up live sync, but never let it hold the game hostage.
    // If Firebase is slow, blocked, or misconfigured, we fall through to solo mode.
    show(`<div class="pad"><div class="wait" style="padding-top:90px">
      <div class="spin"></div><div class="sub">Starting up…</div></div></div>`);

    const initing = Sync.init();
    // With 70 phones on school Wi-Fi the first connection can take longer than
    // the old 6s ceiling, and a student who timed out had no room field at all
    // and no way back in. So: stop waiting after 8s, but keep the attempt alive
    // and repaint the start screen if it lands late.
    initing.then(ok => {
      if(ok && !S && document.getElementById('go') && document.getElementById('nm')) screenStart();
    }).catch(()=>{});

    try{
      await Promise.race([ initing, new Promise(res => setTimeout(res, 8000)) ]);
    }catch(e){}
    startOrResume();
  }

  async function startOrResume(){
    const saved = load();
    if(!(saved && saved.S && saved.S.name)){ screenStart(); return; }

    S = saved.S;
    const scr = saved.screen;
    savedRoom = saved.room || S.room || null;
    savedPid  = saved.pid  || null;

    /* Try to slip back into the room before showing anything. This is the fix for
       "my phone dropped out and I couldn't come back in": the game state was always
       safe in localStorage, but the room code and player id were not, so a resumed
       student was forced to play solo and never reached the leaderboard. */
    let rejoined = false;
    if(Sync.enabled && savedRoom && savedPid){
      try{
        const pid = await Sync.rejoinRoom(savedRoom, savedPid, {
          name: S.name, team: S.team,
          score: S.finalScore != null ? S.finalScore : G.score(S, S.round).total,
          round: S.round, done: S.finalScore != null
        });
        if(pid){ savedPid = pid; attachRoom(); rejoined = true; }
      }catch(e){}
    }

    show(`<div class="pad fade" style="padding-top:60px">
      ${LOCKUP}
      <div class="eyebrow">Welcome back</div>
      <h2>Resume Pulse?</h2>
      <p class="muted">You left off in Q${S.round} as ${esc(S.name)}.</p>
      ${rejoined
        ? `<div class="ok">✓ Back in room ${esc(savedRoom)} — your score still counts.</div>`
        : (Sync.enabled && savedRoom
          ? `<p class="tiny">Couldn't reach room ${esc(savedRoom)}. You can still finish — your score
             can be sent to the leaderboard from the results screen.</p>`
          : '')}
      <button class="btn" id="res">Resume Q${S.round}</button>
      <button class="btn ghost" id="new">Start a new company</button>
      ${FOOTMARK}
    </div>`);

    document.getElementById('res').onclick = () => {
      if(!rejoined){
        // Finish solo rather than pretend we are synced. The results screen still
        // offers to push the final score to the room.
        live = false; planOpen = 99; decideOpen = 99;
      }
      if(scr === 'final' || S.finalScore != null) screenFinal();
      else if((scr === 'resolve' || scr === 'events') && S.pending){
        // Choice already applied before the phone dropped — show the outcome
        // again, never re-run it.
        pendingEvents = S.pending.events || [];
        lastDeltas = S.pending.deltas || '';
        const R = G.ROUNDS[S.round - 1];
        const o = R.options.find(x => x.key === S.pending.key) || R.options[0];
        scr === 'events' ? screenEvents() : screenResolve(o);
      }
      else if(scr === 'dilemma') screenDilemma();
      else if(scr === 'waitd') gateOrDilemma();
      else if(scr === 'wait') gateOrAllocate();
      else screenAllocate();
    };
    document.getElementById('new').onclick = () => { wipe(); S = null; screenStart(); };
  }

  boot();
})();
</script>

</html>
